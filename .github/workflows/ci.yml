name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        nim-version: ["2.2.10", "1.6.6"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim-version }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/jsc-nim
          key: jsc-nim-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/jsc/link.nim') }}
      - run: nimble test
      - if: runner.os == 'Linux'
        run: nim c -d:release --passL:-static -o:static_test tests/test_jsc.nim && ./static_test
